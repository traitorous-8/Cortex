[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-core"
version = "0.1.0"
description = "Cortex-Core — computer vision pipeline for PPE safety compliance monitoring."
requires-python = ">=3.9"
dependencies = [
    "ultralytics",
    "numpy",
    "opencv-python",
    "weasyprint",
]

[project.scripts]
cortex-detect = "cortex.cli:main"
